<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>화석 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#24303A; --ink-2:#4A5763; --paper:#FFFDF8; --ground:#E6EEF3;
  --sea:#2E7DB0; --sea-deep:#1E5A85; --sky:#BFE3F5;
  --sand:#E6C377; --sand-2:#D9AD5C; --clay:#B9744A; --rock:#8A8276; --rock-2:#6E675C;
  --accent:#E8553E; --accent-2:#C7432E; --ok:#3FA36B; --warn:#F2B233; --bad:#D9483B;
  --tab1:#5B9BD5; --tab2:#E0A93B; --tab3:#E8553E; --tab4:#8C6B4F; --tab5:#6AAE78;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
button{font-family:var(--display);cursor:pointer;border:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;padding:8px 16px 0;width:100%;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:nowrap;white-space:nowrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,3.1vw,30px);margin:0;letter-spacing:-.5px;flex:none}
.brand .sub{font-size:clamp(11px,1.7vw,16px);color:var(--ink-2);border-left:2px solid rgba(36,48,58,.25);padding-left:10px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;max-width:1240px;margin:6px auto 0;padding:0 36px 0 16px;overflow-x:auto;scrollbar-width:none;width:100%;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:150px;padding:10px 14px 12px;border-radius:14px 14px 0 0;background:#fff;color:var(--ink-2);font-size:18px;border:3px solid var(--ink);border-bottom:none;position:relative;top:3px;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s}
.tab .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px}
.tab.active{color:#fff;top:0;padding-bottom:15px}
.tab.active[data-tab="1"]{background:var(--tab1)}
.tab.active[data-tab="2"]{background:var(--tab2)}
.tab.active[data-tab="3"]{background:var(--tab3)}
.tab.active[data-tab="4"]{background:var(--tab4)}
.tab.active[data-tab="5"]{background:var(--tab5)}
.tab.active .num{background:#fff;color:var(--ink)}

/* ---------- 본문 ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 6px;width:100%;flex:1 0 auto;display:flex;flex-direction:column}
.panel{display:none;background:var(--paper);border:3px solid var(--ink);border-radius:0 18px 18px 18px;padding:12px;box-shadow:0 8px 0 rgba(36,48,58,.12)}
.panel.active{display:block;flex:1 0 auto}
/* 태블릿 한 화면에 들어오도록: 화면 높이에 맞춰 스테이지 폭을 줄임 (16:9 유지) */
.stage-wrap{position:relative;width:min(100%,calc((100vh - 250px)*16/9));width:min(100%,calc((100dvh - 250px)*16/9));margin:0 auto;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky)}
#panel4 .stage-wrap{width:min(100%,calc((100vh - 305px)*16/9));width:min(100%,calc((100dvh - 305px)*16/9))}
.stage-wrap svg,.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-wrap canvas{touch-action:none}
.caption{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,253,248,.94);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-size:clamp(14px,1.9vw,21px);line-height:1.45;font-weight:500;pointer-events:none;transition:opacity .3s}
.caption b{color:var(--accent-2)}
.caption small{display:block;font-size:.78em;color:var(--ink-2);font-weight:400}
.caption.hidden{opacity:0}
.badge{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(14px,1.8vw,20px);padding:6px 14px;border-radius:999px;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.controls .spacer{flex:1}
.btn{font-size:19px;padding:10px 20px;border-radius:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.big{font-size:24px;padding:14px 30px}
.steps{display:flex;gap:6px;align-items:center}
.steps .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:background .2s}
.steps .dot.on{background:var(--tab1)}
.steps .dot.done{background:var(--ink)}
.note{margin-top:14px;padding:12px 16px;border-left:6px solid var(--tab1);background:#fff;border-radius:8px;font-size:15px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* ---------- 탭2 화석으로 잘 남으려면? ---------- */
.lab-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.lab-grid{grid-template-columns:300px 1fr}}
.lab-side{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px}
.card h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.card h3 .tag{font-size:13px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:999px;font-family:var(--body)}
.org-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.org{border:3px solid var(--ink);border-radius:12px;background:#F4F7FA;padding:6px 4px 4px;text-align:center;font-family:var(--display);font-size:15px;color:var(--ink);transition:transform .1s}
.org svg{width:100%;height:46px;display:block}
.org:disabled,.seg button:disabled{opacity:.55;cursor:default}
.org.sel{background:var(--tab2);color:#fff;transform:translateY(-2px)}
.org small{display:block;font-family:var(--body);font-size:11px;color:inherit;opacity:.85;white-space:nowrap}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;background:#F4F7FA;color:var(--ink);font-size:16px;line-height:1.2;word-break:keep-all}
.seg button small{display:block;font-family:var(--body);font-size:11px;opacity:.75}
.seg button.sel{background:var(--tab2);color:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.result{margin-top:14px;display:none;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.result.show{display:block}
.result .head{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;font-family:var(--display);font-size:22px}
.result .head .stars{font-size:26px;letter-spacing:2px}
.result .body{padding:12px 16px;font-size:15px}
.result .body ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.result .body li{display:flex;gap:8px;align-items:flex-start}
.chip{flex:none;font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;padding:2px 9px;border-radius:999px;margin-top:2px}
.chip.good{background:var(--ok)} .chip.bad{background:var(--bad)}
.grade-3{background:var(--ok)} .grade-2{background:#6BB98A} .grade-1{background:var(--warn);color:var(--ink)!important} .grade-0{background:var(--bad)} .grade-i{background:#8C7BB5}

/* ---------- 탭3 붕어빵 ---------- */
.gauge-wrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(60%,520px);display:none}
.gauge-wrap.show{display:block}
.gauge{height:30px;border:3px solid var(--ink);border-radius:999px;background:#fff;position:relative;overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.6;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#F7D774,#E8553E)}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);left:0}
.gauge-label{text-align:center;font-family:var(--display);font-size:15px;margin-top:4px;background:rgba(255,255,255,.85);border-radius:8px;display:inline-block;padding:2px 10px;position:relative;left:50%;transform:translateX(-50%)}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(20px,3vw,34px);padding:12px 28px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.good{background:var(--ok)} .toast.bad{background:var(--bad)}
.stage-wrap.hint{cursor:pointer}

/* ---------- 탭4 체험 ---------- */
.mode-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mode-row .seg{max-width:320px;flex:1}
.mode-row .seg button.sel{background:var(--tab4)}
.foot-pick{display:flex;gap:6px}
.foot-pick button{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:15px}
.foot-pick button svg{width:30px;height:30px}
.foot-pick button.sel{background:var(--tab4);color:#fff}
.overlay-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.overlay-hint span{background:rgba(36,48,58,.8);color:#fff;font-family:var(--display);font-size:clamp(18px,2.6vw,28px);padding:10px 22px;border-radius:14px}

/* ---------- 탭5 퀴즈 ---------- */
.quiz{display:flex;flex-direction:column;gap:16px}
.q{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px}
.q h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.q h3 .qn{background:var(--tab5);color:#fff;border-radius:8px;padding:0 10px;font-size:16px}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:19px;color:var(--tab5);margin:0 4px;padding:0 6px;cursor:pointer;border-radius:6px 6px 0 0}
.blank.target{background:#E4F3E8}
.blank.right{color:var(--ok)} .blank.wrong{color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.word{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;background:#F4F7FA;font-size:16px}
.word.sel{background:var(--tab5);color:#fff}
.word.used{opacity:.35}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bin{border:3px dashed var(--ink);border-radius:12px;min-height:120px;padding:10px;background:#F7FAF7}
.bin h4{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px;text-align:center}
.bin.target{background:#E4F3E8;border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:44px}
.item{border:3px solid var(--ink);border-radius:10px;padding:6px 12px;background:#fff;font-size:15px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.item.sel{background:var(--tab5);color:#fff}
.item.right{border-color:var(--ok);background:#E4F3E8}
.item.wrong{border-color:var(--bad);background:#FBE5E2}
.bin .item{margin:3px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.choice{border:3px solid var(--ink);border-radius:12px;padding:10px;background:#fff;text-align:left;font-family:var(--body);font-size:15px;line-height:1.4}
.choice.sel{background:var(--tab5);color:#fff}
.choice.right{background:#E4F3E8;border-color:var(--ok);color:var(--ink)} .choice.wrong{background:#FBE5E2;border-color:var(--bad);color:var(--ink)}
.mc-pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mc-pic{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.mc-pic svg{width:100%;height:auto;display:block}
.mc-pic .lbl{display:flex}
.mc-pic .lbl button{flex:1;padding:8px;font-size:17px;background:#F4F7FA;color:var(--ink);border-top:3px solid var(--ink)}
.mc-pic .lbl button+button{border-left:3px solid var(--ink)}
.mc-pic .lbl button.sel{background:var(--tab5);color:#fff}
.mc-pic .lbl button.right{background:var(--ok);color:#fff} .mc-pic .lbl button.wrong{background:var(--bad);color:#fff}
.score{font-family:var(--display);font-size:26px;text-align:center;padding:14px;border-radius:14px;background:var(--tab5);color:#fff;display:none}
.score.show{display:block}
.qtop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.qtop .qn{background:var(--tab5);color:#fff;border-radius:8px;padding:2px 12px;font-family:var(--display);font-size:16px}
.qtop .qtab{font-size:13px;color:var(--ink-2);background:#EEF3F0;border-radius:999px;padding:2px 10px}
.q h3{font-size:21px;line-height:1.45}
.qbody .choices{grid-template-columns:1fr 1fr}
.choice{font-size:16px;padding:12px 14px}
.qfeed{margin-top:14px;padding:12px 16px;border-radius:12px;border:3px solid var(--ok);background:#E4F3E8;font-size:15px}
.qfeed.bad{border-color:var(--bad);background:#FBE5E2}
.qfeed .fh{font-family:var(--display);font-size:20px;margin-bottom:4px}
.qctl{margin-top:14px;display:flex;justify-content:flex-end}
.seq{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:3px dashed var(--ink);border-radius:12px;background:#F7FAF7}
.seqitem{border:3px solid var(--ink);border-radius:10px;padding:4px 10px;background:#fff;font-size:15px}
.seqitem b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:4px}
.seqitem.right{border-color:var(--ok);background:#E4F3E8} .seqitem.wrong{border-color:var(--bad);background:#FBE5E2}
.seq .arrow{color:var(--ink-2)} .seqhint{color:var(--ink-2);font-size:14px}
.item.used{opacity:.3;pointer-events:none}
.mc-pic .cap-s{text-align:center;font-family:var(--display);font-size:15px;color:var(--ink-2);padding:4px}
.review{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.rv{border:3px solid var(--ink);border-radius:10px;padding:4px 10px;font-family:var(--display);font-size:15px;background:#fff}
.rv small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-2)}
.rv.ok{border-color:var(--ok);background:#E4F3E8} .rv.no{border-color:var(--bad);background:#FBE5E2}
.mini-note{margin-top:8px;font-size:12px;color:var(--ink-2);line-height:1.45}
@media(max-width:600px){.sort,.choices,.mc-pics{grid-template-columns:1fr}.org-grid{grid-template-columns:repeat(4,1fr)}.tab{min-width:120px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* ---------- 푸터 ---------- */
.site-foot{max-width:1240px;margin:auto auto 0;padding:4px 16px 8px;text-align:center;font-size:13px;color:var(--ink-2);width:100%}

/* ---------- 그림형 퀴즈 ---------- */
#panel5 .q.tall{min-height:min(560px,calc(100dvh - 220px));display:flex;flex-direction:column}
#panel5 .qbody{flex:1;display:flex;flex-direction:column;justify-content:center}
/* 탭2 결과 패널 */
.result .rwrap{padding:10px 14px 12px}
.rbadge{font-family:var(--display);font-size:14px;padding:3px 12px;border-radius:999px;color:#fff;display:inline-block;border:2px solid var(--ink)}
.rbadge.b-high{background:var(--ok)} .rbadge.b-mid{background:var(--warn);color:var(--ink)} .rbadge.b-low{background:#B9744A} .rbadge.b-fail{background:var(--bad)} .rbadge.b-rare{background:#8C7BB5}
.rtitle{font-family:var(--display);font-size:21px;margin:4px 0 2px}
.rdesc{font-size:14px;color:var(--ink-2);line-height:1.5}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rchip{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;background:#F4F7FA}
.rchip.good{background:#E4F3E8;border-color:var(--ok)} .rchip.bad{background:#FBE5E2;border-color:var(--bad)}
/* 탭2: 데스크톱에서는 오른쪽 영역이 화면 높이를 꽉 채우도록 유연한 높이 사용 */
@media(min-width:900px){
  #panel2.active{display:flex;flex-direction:column}
  #panel2 .lab-grid{flex:1 1 auto;min-height:0}
  #panel2 .lab-grid>div:last-child{display:flex;flex-direction:column;min-height:0}
  #panel2 .stage-wrap{flex:1 1 auto;min-height:250px;aspect-ratio:auto;width:100%}
  #panel2 .result,#panel2 .controls{flex:0 0 auto}
}
.qart{min-height:220px;display:grid;place-items:center;margin:10px 0}
.qart svg{width:min(500px,100%);height:auto;display:block}
#ctl3{justify-content:flex-end}
.pic2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;margin:10px 0}
.piccard{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px;cursor:pointer;text-align:center;position:relative;transition:transform .12s}
.piccard svg{width:100%;height:auto;display:block;border-radius:8px}
.piccard .pl{font-family:var(--display);font-size:19px;margin-top:8px}
.piccard:hover{transform:translateY(-2px)}
.piccard.right{border-color:var(--ok);background:#E4F3E8}
.piccard.wrong{border-color:var(--bad);background:#FBE5E2}
.piccard.dim{opacity:.5}
.mark{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;border:3px solid var(--ink)}
.mark.ok{background:var(--ok)} .mark.no{background:var(--bad)}
.oxrow{display:flex;gap:24px;justify-content:center;margin-top:10px}
.oxbtn{width:104px;height:104px;border-radius:50%;border:4px solid var(--ink);background:#fff;font-family:var(--display);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);line-height:1.1}
.oxbtn>span{font-size:38px;line-height:1}
.oxbtn small{display:block;font-size:12px;font-family:var(--body);color:var(--ink-2)}
.oxbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.oxbtn.right{background:var(--ok);color:#fff} .oxbtn.right small{color:#fff}
.oxbtn.wrong{background:var(--bad);color:#fff} .oxbtn.wrong small{color:#fff}
#panel5 .choices .choice{font-family:var(--display);font-size:19px;padding:14px;text-align:center}
.fossil-tag{display:inline-block;background:#FFF3D6;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px;font-family:var(--body);font-weight:700;margin-left:8px;vertical-align:middle}
.fossil-tag[hidden]{display:none}
@keyframes popok{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.pop{animation:popok .45s ease}
@media(max-width:600px){.pic2{grid-template-columns:1fr}.oxbtn{width:92px;height:92px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>화석 탐구실</h1><span class="sub">생물의 몸과 흔적은 어떻게 지층에 기록될까?</span></div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="1" role="tab"><span class="num">1</span>화석 형성 과정</button>
  <button class="tab" data-tab="2" role="tab"><span class="num">2</span>화석으로 잘 남으려면?</button>

function deposit(rect, topY, ms, fx, x0 = 0, x1 = 960, fromY = 150) {
  return new Promise(res => {
    const y0 = parseFloat(rect.getAttribute('y')), h0 = parseFloat(rect.getAttribute('height')) || 0, bottom = y0 + h0;
    const col = rect.getAttribute('fill');

    const target = toTop == null ? bottom : toTop;

    let elapsed = 0, last = performance.now(), lastSpawn = 0;
    const ep = _animEpoch;
    const step = now => {

      const row = document.createElement('div'); row.className = 'oxrow'; body.appendChild(row);
      [['◯', '맞아요'], ['✕', '아니에요']].forEach(([icon, txt], i) => {
        const b = document.createElement('button'); b.className = 'oxbtn'; b.innerHTML = `<span>${icon}<small>${txt}</small></span>`;
        b.onclick = () => { if (answered) return; const okA = i === Q.ans; row.children[Q.ans].classList.add('right'); if (!okA) b.classList.add('wrong'); finish(okA, row.children[Q.ans]); };
        row.appendChild(b);
      });
    } else { // mc
      const art = document.createElement('div'); art.className = 'qart'; art.appendChild(Q.art()); body.appendChild(art);
      body.insertAdjacentHTML('beforeend', `<div class="choices">${Q.choices.map((c, i) => `<button class="choice" data-i="${i}">${c}</button>`).join('')}</div>`);
      body.querySelectorAll('.choice').forEach(c => c.onclick = () => {
        if (answered) return;
        const okA = +c.dataset.i === Q.ans;
        body.querySelectorAll('.choice').forEach(x => { if (+x.dataset.i === Q.ans) { x.classList.add('right'); x.insertAdjacentHTML('beforeend', ' ✔'); } else if (x === c) { x.classList.add('wrong'); x.insertAdjacentHTML('beforeend', ' ✖'); } });
        finish(okA, body.querySelector('.choice.right'));
      });
    }
    next.onclick = () => { pos++; render(); };
  }
  function renderEnd() {
    const score = results.filter(Boolean).length;
    const wrong = QS.map((_, i) => i).filter(i => !results[i]);
    const msg = score === QS.length ? '완벽해요! 화석의 핵심 기록을 모두 해독했어요.' : score >= 2 ? '좋아요! 헷갈린 문제만 다시 확인해 볼까요?' : '괜찮아요! 핵심 장면을 다시 보면 금방 알 수 있어요.';
    const box = document.createElement('div'); box.className = 'q';
    box.innerHTML = `<div class="score show">${QS.length}문제 중 ${score}문제 정답!</div><div style="text-align:center;margin-top:10px;font-size:16px">${msg}</div><div class="review">${QS.map((q, i) => `<span class="rv ${results[i] ? 'ok' : 'no'}">Q${i + 1} ${results[i] ? '○' : '✕'}</span>`).join('')}</div><div class="qctl" style="justify-content:center;flex-wrap:wrap;gap:10px">${wrong.length ? '<button class="btn warn big" id="q-wrong">틀린 문제만 다시 보기</button>' : ''}<button class="btn big" id="q-back">'화석으로 잘 남으려면?' 탭으로 돌아가기</button><button class="btn primary big" id="q-restart">↺ 처음부터 다시 풀기</button></div>`;
    quiz.appendChild(box);
    const w = box.querySelector('#q-wrong'); if (w) w.onclick = () => { queue = wrong; pos = 0; render(); };
    box.querySelector('#q-back').onclick = () => $('.tab[data-tab="2"]').click();
    box.querySelector('#q-restart').onclick = () => { queue = QS.map((_, i) => i); pos = 0; results = QS.map(() => null); render(); };
  }
  render();
})();

</script>
</body>
</html>
