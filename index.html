<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>화석 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#24303A; --ink-2:#4A5763; --paper:#FFFDF8; --ground:#E6EEF3;
  --sea:#2E7DB0; --sea-deep:#1E5A85; --sky:#BFE3F5;
  --sand:#E6C377; --sand-2:#D9AD5C; --clay:#B9744A; --rock:#8A8276; --rock-2:#6E675C;
  --accent:#E8553E; --accent-2:#C7432E; --ok:#3FA36B; --warn:#F2B233; --bad:#D9483B;
  --tab1:#5B9BD5; --tab2:#E0A93B; --tab3:#E8553E; --tab4:#8C6B4F; --tab5:#6AAE78;
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;border:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto;padding:8px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;letter-spacing:-.5px}
.brand .sub{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:6px;max-width:1120px;margin:6px auto 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:150px;padding:10px 14px 12px;border-radius:14px 14px 0 0;background:#fff;color:var(--ink-2);font-size:18px;border:3px solid var(--ink);border-bottom:none;position:relative;top:3px;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s}
.tab .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px}
.tab.active{color:#fff;top:0;padding-bottom:15px}
.tab.active[data-tab="1"]{background:var(--tab1)}
.tab.active[data-tab="2"]{background:var(--tab2)}
.tab.active[data-tab="3"]{background:var(--tab3)}
.tab.active[data-tab="4"]{background:var(--tab4)}
.tab.active[data-tab="5"]{background:var(--tab5)}
.tab.active .num{background:#fff;color:var(--ink)}

/* ---------- 본문 ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 6px}
.panel{display:none;background:var(--paper);border:3px solid var(--ink);border-radius:0 18px 18px 18px;padding:12px;box-shadow:0 8px 0 rgba(36,48,58,.12)}
.panel.active{display:block}
/* 태블릿 한 화면에 들어오도록: 화면 높이에 맞춰 스테이지 폭을 줄임 (16:9 유지) */
.stage-wrap{position:relative;width:min(100%,calc((100vh - 250px)*16/9));width:min(100%,calc((100dvh - 250px)*16/9));margin:0 auto;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--sky)}
#panel4 .stage-wrap{width:min(100%,calc((100vh - 305px)*16/9));width:min(100%,calc((100dvh - 305px)*16/9))}
.stage-wrap svg,.stage-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-wrap canvas{touch-action:none}
.caption{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,253,248,.94);border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font-size:clamp(14px,1.9vw,21px);line-height:1.45;font-weight:500;pointer-events:none;transition:opacity .3s}
.caption b{color:var(--accent-2)}
.caption.hidden{opacity:0}
.badge{position:absolute;top:12px;left:12px;background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(14px,1.8vw,20px);padding:6px 14px;border-radius:999px;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.controls .spacer{flex:1}
.btn{font-size:19px;padding:10px 20px;border-radius:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.big{font-size:24px;padding:14px 30px}
.steps{display:flex;gap:6px;align-items:center}
.steps .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:background .2s}
.steps .dot.on{background:var(--tab1)}
.steps .dot.done{background:var(--ink)}
.note{margin-top:14px;padding:12px 16px;border-left:6px solid var(--tab1);background:#fff;border-radius:8px;font-size:15px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* ---------- 탭2 실험실 ---------- */
.lab-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.lab-grid{grid-template-columns:300px 1fr}}
.lab-side{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px}
.card h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.card h3 .tag{font-size:13px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:999px;font-family:var(--body)}
.org-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.org{border:3px solid var(--ink);border-radius:12px;background:#F4F7FA;padding:6px 4px 4px;text-align:center;font-family:var(--display);font-size:15px;color:var(--ink);transition:transform .1s}
.org svg{width:100%;height:52px;display:block}
.org.sel{background:var(--tab2);color:#fff;transform:translateY(-2px)}
.org small{display:block;font-family:var(--body);font-size:11px;color:inherit;opacity:.85;white-space:nowrap}
.seg{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px 6px;background:#F4F7FA;color:var(--ink);font-size:17px;line-height:1.2}
.seg button small{display:block;font-family:var(--body);font-size:11px;opacity:.75}
.seg button.sel{background:var(--tab2);color:#fff}
.seg button+button{border-left:3px solid var(--ink)}
.result{margin-top:14px;display:none;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.result.show{display:block}
.result .head{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;font-family:var(--display);font-size:22px}
.result .head .stars{font-size:26px;letter-spacing:2px}
.result .body{padding:12px 16px;font-size:15px}
.result .body ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.result .body li{display:flex;gap:8px;align-items:flex-start}
.chip{flex:none;font-family:var(--display);font-size:13px;background:var(--ink);color:#fff;padding:2px 9px;border-radius:999px;margin-top:2px}
.chip.good{background:var(--ok)} .chip.bad{background:var(--bad)}
.grade-3{background:var(--ok)} .grade-2{background:#6BB98A} .grade-1{background:var(--warn);color:var(--ink)!important} .grade-0{background:var(--bad)} .grade-i{background:#8C7BB5}

/* ---------- 탭3 붕어빵 ---------- */
.gauge-wrap{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(60%,520px);display:none}
.gauge-wrap.show{display:block}
.gauge{height:30px;border:3px solid var(--ink);border-radius:999px;background:#fff;position:relative;overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.6;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#F7D774,#E8553E)}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);left:0}
.gauge-label{text-align:center;font-family:var(--display);font-size:15px;margin-top:4px;background:rgba(255,255,255,.85);border-radius:8px;display:inline-block;padding:2px 10px;position:relative;left:50%;transform:translateX(-50%)}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(20px,3vw,34px);padding:12px 28px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.good{background:var(--ok)} .toast.bad{background:var(--bad)}
.stage-wrap.hint{cursor:pointer}

/* ---------- 탭4 체험 ---------- */
.mode-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mode-row .seg{max-width:320px;flex:1}
.mode-row .seg button.sel{background:var(--tab4)}
.foot-pick{display:flex;gap:6px}
.foot-pick button{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:15px}
.foot-pick button svg{width:30px;height:30px}
.foot-pick button.sel{background:var(--tab4);color:#fff}
.overlay-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.overlay-hint span{background:rgba(36,48,58,.8);color:#fff;font-family:var(--display);font-size:clamp(18px,2.6vw,28px);padding:10px 22px;border-radius:14px}

/* ---------- 탭5 퀴즈 ---------- */
.quiz{display:flex;flex-direction:column;gap:16px}
.q{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:16px}
.q h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.q h3 .qn{background:var(--tab5);color:#fff;border-radius:8px;padding:0 10px;font-size:16px}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink);text-align:center;font-family:var(--display);font-size:19px;color:var(--tab5);margin:0 4px;padding:0 6px;cursor:pointer;border-radius:6px 6px 0 0}
.blank.target{background:#E4F3E8}
.blank.right{color:var(--ok)} .blank.wrong{color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.word{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;background:#F4F7FA;font-size:16px}
.word.sel{background:var(--tab5);color:#fff}
.word.used{opacity:.35}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bin{border:3px dashed var(--ink);border-radius:12px;min-height:120px;padding:10px;background:#F7FAF7}
.bin h4{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px;text-align:center}
.bin.target{background:#E4F3E8;border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:44px}
.item{border:3px solid var(--ink);border-radius:10px;padding:6px 12px;background:#fff;font-size:15px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.item.sel{background:var(--tab5);color:#fff}
.item.right{border-color:var(--ok);background:#E4F3E8}
.item.wrong{border-color:var(--bad);background:#FBE5E2}
.bin .item{margin:3px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.choice{border:3px solid var(--ink);border-radius:12px;padding:10px;background:#fff;text-align:left;font-family:var(--body);font-size:15px;line-height:1.4}
.choice.sel{background:var(--tab5);color:#fff}
.choice.right{background:#E4F3E8;border-color:var(--ok);color:var(--ink)} .choice.wrong{background:#FBE5E2;border-color:var(--bad);color:var(--ink)}
.mc-pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mc-pic{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.mc-pic svg{width:100%;height:auto;display:block}
.mc-pic .lbl{display:flex}
.mc-pic .lbl button{flex:1;padding:8px;font-size:17px;background:#F4F7FA;color:var(--ink);border-top:3px solid var(--ink)}
.mc-pic .lbl button+button{border-left:3px solid var(--ink)}
.mc-pic .lbl button.sel{background:var(--tab5);color:#fff}
.mc-pic .lbl button.right{background:var(--ok);color:#fff} .mc-pic .lbl button.wrong{background:var(--bad);color:#fff}
.score{font-family:var(--display);font-size:26px;text-align:center;padding:14px;border-radius:14px;background:var(--tab5);color:#fff;display:none}
.score.show{display:block}
.qtop{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.qtop .qn{background:var(--tab5);color:#fff;border-radius:8px;padding:2px 12px;font-family:var(--display);font-size:16px}
.qtop .qtab{font-size:13px;color:var(--ink-2);background:#EEF3F0;border-radius:999px;padding:2px 10px}
.q h3{font-size:21px;line-height:1.45}
.qbody .choices{grid-template-columns:1fr 1fr}
.choice{font-size:16px;padding:12px 14px}
.qfeed{margin-top:14px;padding:12px 16px;border-radius:12px;border:3px solid var(--ok);background:#E4F3E8;font-size:15px}
.qfeed.bad{border-color:var(--bad);background:#FBE5E2}
.qfeed .fh{font-family:var(--display);font-size:20px;margin-bottom:4px}
.qctl{margin-top:14px;display:flex;justify-content:flex-end}
.seq{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:3px dashed var(--ink);border-radius:12px;background:#F7FAF7}
.seqitem{border:3px solid var(--ink);border-radius:10px;padding:4px 10px;background:#fff;font-size:15px}
.seqitem b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;margin-right:4px}
.seqitem.right{border-color:var(--ok);background:#E4F3E8} .seqitem.wrong{border-color:var(--bad);background:#FBE5E2}
.seq .arrow{color:var(--ink-2)} .seqhint{color:var(--ink-2);font-size:14px}
.item.used{opacity:.3;pointer-events:none}
.mc-pic .cap-s{text-align:center;font-family:var(--display);font-size:15px;color:var(--ink-2);padding:4px}
.review{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.rv{border:3px solid var(--ink);border-radius:10px;padding:4px 10px;font-family:var(--display);font-size:15px;background:#fff}
.rv small{display:block;font-family:var(--body);font-size:11px;color:var(--ink-2)}
.rv.ok{border-color:var(--ok);background:#E4F3E8} .rv.no{border-color:var(--bad);background:#FBE5E2}
@media(max-width:600px){.sort,.choices,.mc-pics{grid-template-columns:1fr}.org-grid{grid-template-columns:repeat(4,1fr)}.brand h1{font-size:24px}.tab{min-width:120px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* ---------- 푸터 ---------- */
.site-foot{max-width:1120px;margin:0 auto;padding:4px 16px 8px;text-align:center;font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>화석 이야기</h1><span class="sub">통합과학2 · 지질시대의 환경과 생물 · 화석이 만들어지는 과정</span></div>
</header>
<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="1" role="tab"><span class="num">1</span>화석이 만들어지기까지</button>
  <button class="tab" data-tab="2" role="tab"><span class="num">2</span>화석 실험실</button>
  <button class="tab" data-tab="3" role="tab"><span class="num">3</span>붕어빵으로 보는 몰드·캐스트</button>
  <button class="tab" data-tab="4" role="tab"><span class="num">4</span>흔적도 화석이 돼요</button>
  <button class="tab" data-tab="5" role="tab"><span class="num">5</span>정리 퀴즈</button>
</nav>
<main class="wrap">

<!-- ===== 탭1 ===== -->
<section class="panel active" id="panel1">
  <div class="stage-wrap" id="stage1">
    <svg id="svg1" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="badge" id="badge1">시작</div>
    <div class="caption" id="cap1"></div>
  </div>
  <div class="controls">
    <button class="btn" id="t1-prev">◀ 이전</button>
    <button class="btn primary" id="t1-next">다음 ▶</button>
    <button class="btn" id="t1-auto">▶ 자동 재생</button>
    <div class="steps" id="t1-steps"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="t1-reset">↺ 처음부터</button>
  </div>
</section>

<!-- ===== 탭2 ===== -->
<section class="panel" id="panel2">
  <div class="lab-grid">
    <div class="lab-side">
      <div class="card">
        <h3>어떤 생물인가요? <span class="tag">조건 ③</span></h3>
        <div class="org-grid" id="org-grid"></div>
        <div id="org-hint" style="font-size:13px;color:var(--ink-2);margin-top:8px"></div>
      </div>
      <div class="card">
        <h3>얼마나 빨리 묻히나요? <span class="tag">조건 ①</span></h3>
        <div class="seg" id="seg-burial">
          <button data-v="fast" class="sel">빠르게 매몰<small>바로 퇴적물에 덮임</small></button>
          <button data-v="slow">느리게 매몰<small>바닥에 오래 방치</small></button>
        </div>
      </div>
      <div class="card">
        <h3>어떤 환경인가요? <span class="tag">조건 ②</span></h3>
        <div class="seg" id="seg-oxy">
          <button data-v="low" class="sel">산소 적음<small>분해가 느린 곳</small></button>
          <button data-v="high">산소 많음<small>분해가 빠른 곳</small></button>
        </div>
      </div>
      <button class="btn primary big" id="t2-run" style="width:100%">🔬 실험 시작</button>
    </div>
    <div>
      <div class="stage-wrap" id="stage2">
        <svg id="svg2" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"></svg>
        <div class="badge" id="badge2">실험 준비</div>
        <div class="caption" id="cap2">왼쪽에서 생물과 조건을 고른 뒤 <b>실험 시작</b>을 눌러 보세요.</div>
      </div>
      <div class="result" id="result2">
        <div class="head" id="result2-head"><span class="stars" id="result2-stars"></span><span id="result2-title"></span></div>
        <div class="body"><div id="result2-desc"></div><ul id="result2-list"></ul></div>
      </div>
    </div>
  </div>
</section>

<!-- ===== 탭3 ===== -->
<section class="panel" id="panel3">
  <div class="stage-wrap" id="stage3">
    <svg id="svg3" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="gauge-wrap" id="gauge3"><div class="gauge"><div class="fill" id="g3-fill"></div><div class="zone" id="g3-zone"></div><div class="needle" id="g3-needle"></div></div><div class="gauge-label" id="g3-label">초록 구간에서 뒤집기!</div></div>
    <div class="toast" id="toast3"></div>
    <div class="badge" id="badge3">붕어빵 가게</div>
    <div class="caption" id="cap3"></div>
  </div>
  <div class="controls" id="ctl3"></div>
</section>

<!-- ===== 탭4 ===== -->
<section class="panel" id="panel4">
  <div class="mode-row">
    <div class="seg" id="seg-mode4"><button data-v="foot" class="sel">🦶 발자국 남기기</button><button data-v="burrow">🪱 굴 파기</button></div>
    <div class="foot-pick" id="foot-pick"></div>
  </div>
  <div class="stage-wrap" id="stage4">
    <canvas id="cv4" width="960" height="540"></canvas>
    <div class="overlay-hint" id="hint4"><span>진흙 위를 손가락으로 드래그해 걸어가 보세요</span></div>
    <div class="badge" id="badge4">체험</div>
    <div class="caption hidden" id="cap4"></div>
  </div>
  <div class="controls">
    <button class="btn" id="t4-clear">🧹 지우기</button>
    <button class="btn primary big" id="t4-run">⏳ 화석화 시작</button>

/* ===== 연속 퇴적 / 침식 / 융기 효과 ===== */
/* rect 의 아래쪽(y+height)을 고정한 채 위쪽 경계를 topY 까지 천천히 올리며, 입자가 위에서 떨어져 쌓이는 모습 */
function deposit(rect, topY, ms, fx, x0 = 0, x1 = 960, fromY = 150) {
  return new Promise(res => {
    const y0 = parseFloat(rect.getAttribute('y')), h0 = parseFloat(rect.getAttribute('height')) || 0, bottom = y0 + h0;
    const col = rect.getAttribute('fill');
    const t0 = performance.now(); let lastSpawn = 0;
    const step = now => {
      const t = clamp((now - t0) / ms, 0, 1);
      const y = lerp(y0, topY, t);
      attr(rect, { y, height: bottom - y });
      if (t < 1 && now - lastSpawn > 28) {
        lastSpawn = now;
        for (let i = 0; i < 3; i++) {
          const c = E('circle', { cx: rnd(x0, x1), cy: fromY - rnd(0, 40), r: rnd(2, 4.5), fill: col, stroke: '#24303A', 'stroke-width': 1 });
          fx.appendChild(c);
          const land = () => parseFloat(rect.getAttribute('y'));
          tween(c, { cy: land() - 2 }, rnd(500, 800), t => t * t).then(() => c.remove());
        }
      }
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
/* 위에서부터 깎여 나감: y 는 아래로, height 는 0 으로. 입자가 옆으로 날아감 */
function erode(rect, ms, fx, x0 = 0, x1 = 960, toTop = null) {
  return new Promise(res => {
    const y0 = parseFloat(rect.getAttribute('y')), h0 = parseFloat(rect.getAttribute('height')) || 0, bottom = y0 + h0;
    const target = toTop == null ? bottom : toTop;
    const col = rect.getAttribute('fill');
    const t0 = performance.now(); let lastSpawn = 0;
    const step = now => {
      const t = clamp((now - t0) / ms, 0, 1);
      const y = lerp(y0, target, t);
      attr(rect, { y, height: Math.max(0, bottom - y) });
      if (t < 1 && now - lastSpawn > 40) {
        lastSpawn = now;
        for (let i = 0; i < 3; i++) {
          const c = E('circle', { cx: rnd(x0, x1), cy: y, r: rnd(2, 4), fill: col, stroke: '#24303A', 'stroke-width': 1 });
          fx.appendChild(c);
          tween(c, { cx: parseFloat(c.getAttribute('cx')) + rnd(80, 220), cy: y - rnd(20, 70) }, rnd(500, 900), t => t).then(() => c.remove());
        }
      }
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
/* 융기: 흔들림 → 지층 전체 상승, 바다는 빠져나감 */
async function uplift(ground, waterEls, dy, ms, extraFn) {

  waterEls.forEach(w => css(w, { transform: `translate(0,${dy * 1.6}px)`, opacity: 0 }, ms));
  if (extraFn) extraFn();
  await sleep(ms + 100);
}

    { tab: 1, type: 'order', q: '화석이 만들어지는 과정을 순서대로 눌러 보세요.', items: ['죽음', '매몰', '화석화 작용', '지각 변동(융기)', '풍화·침식', '노출·발견'], exp: '죽음 → 매몰 → 화석화 작용 → 지각 변동(융기) → 풍화·침식 → 노출·발견. 빨리 묻히고, 굳고, 땅 위로 올라와 깎여야 우리가 볼 수 있어요.' },
    { tab: 1, type: 'mc', q: '지하수에 녹아 있던 광물질이 뼈의 <b>빈틈을 채워</b> 뼈가 무겁고 단단해지는 화석화 작용은?', choices: ['침투', '치환', '풍화', '융기'], ans: 0, exp: '빈틈에 광물질이 채워지는 것이 침투, 뼈 성분 자체가 광물로 바뀌는 것이 치환이에요.' },
    { tab: 1, type: 'mc', q: '탭1에서 지층이 융기할 때 지층의 모습으로 옳은 것은?', choices: ['층이 평행한 채로 함께 밀려 올라간다', '위층만 먼저 올라간다', '아래층이 위층을 뚫고 올라간다', '지층이 모두 섞여 버린다'], ans: 0, exp: '융기는 지층 전체가 함께 올라가는 것이라 층의 순서와 나란함은 그대로 유지돼요.' },
    { tab: 2, type: 'mc', q: '화석 실험실: <b>물고기</b>를 <b>느리게 매몰</b>, <b>산소 많음</b> 조건에 두면?', choices: ['완전한 화석', '일부 손상된 화석', '조각 일부만 화석', '화석이 되지 못함'], ans: 3, exp: '묻히기 전에 먹히고 흩어진 데다 분해까지 빨라서 아무것도 남지 않아요.' },
    { tab: 2, type: 'mc', q: '단단한 부분이 없는 <b>해파리</b>가 그나마 흔적을 남길 수 있는 조건은?', choices: ['빠른 매몰 + 산소 적음', '빠른 매몰 + 산소 많음', '느린 매몰 + 산소 적음', '느린 매몰 + 산소 많음'], ans: 0, exp: '연한 몸은 금방 분해되므로, 빨리 묻히고 분해가 아주 느린 곳에서만 눌린 자국(인상)이 드물게 남아요.' },
    { tab: 2, type: 'mc', q: '다음 중 화석으로 남기 <b>어려운</b> 경우는?', choices: ['죽은 뒤 퇴적물에 빠르게 묻힌다', '산소가 적어 분해가 느린 곳에 묻힌다', '뼈나 껍데기 같은 단단한 부분이 있다', '죽은 뒤 바닥에 오랫동안 놓여 있다'], ans: 3, exp: '바닥에 오래 놓이면 청소동물에게 먹히고 물살에 부서져요. 학습지의 조건 ①②③을 떠올려 보세요.' },
    { tab: 3, type: 'pic', q: '그림을 보고 몰드와 캐스트를 골라 보세요.', exp: '움푹 파인 자국(틀)이 몰드, 그 틀을 채워 볼록하게 굳은 것이 캐스트예요. 붕어빵 틀 = 몰드, 붕어빵 = 캐스트!' },
    { tab: 3, type: 'mc', q: '붕어빵과 실제 화석(몰드·캐스트)의 <b>다른 점</b>으로 옳은 것은?', choices: ['화석은 생물이 먼저 묻히고 녹아 없어져야 틀(몰드)이 생긴다', '화석에는 캐스트가 없다', '붕어빵은 캐스트가 먼저 생기고 틀이 나중에 생긴다', '화석의 몰드는 생물 모양과 관계없다'], ans: 0, exp: '붕어빵은 틀이 먼저 있지만, 화석은 껍데기가 지층 속에서 녹아 없어져야 그 자리에 틀(몰드)이 남고, 그 빈 공간이 광물로 채워지면 캐스트가 돼요.' },
    { tab: 3, type: 'mc', q: '탭3에서 껍데기가 녹아 몰드가 생길 때, 껍데기를 둘러싸고 있던 것은?', choices: ['퇴적물이 굳어서 된 암석(퇴적암) 지층', '아직 무른 진흙', '바닷물', '용암'], ans: 0, exp: '퇴적물이 굳어 암석이 된 뒤에 지하수가 껍데기를 녹여야 빈 공간이 무너지지 않고 남아요.' },
    { tab: 4, type: 'mc', q: '다음 중 <b>생흔 화석</b>이 <b>아닌</b> 것은?', choices: ['공룡 발자국', '벌레가 판 굴', '공룡 뼈', '배설물'], ans: 2, exp: '뼈·껍데기처럼 생물의 몸(유해)이 남은 것은 체화석, 발자국·굴·배설물처럼 활동 흔적이 남은 것은 생흔 화석이에요.' },
    { tab: 4, type: 'mc', q: '굴 화석이 주변 암석과 <b>다른 색</b>으로 보이는 까닭은?', choices: ['굴 속에 다른 종류의 퇴적물이 흘러들어 채워진 뒤 굳었기 때문', '벌레의 몸이 그대로 남았기 때문', '굴 속에서 불이 났기 때문', '색을 칠했기 때문'], ans: 0, exp: '굴을 판 생물의 몸은 사라지지만, 굴을 채운 다른 퇴적물이 굳어 주변과 구별되는 생흔 화석이 돼요.' },
    { tab: 4, type: 'mc', q: '진흙 위의 발자국이 화석으로 남으려면 가장 먼저 필요한 일은?', choices: ['다른 퇴적물이 위를 덮어 자국을 보존한다', '비가 와서 자국을 씻어 낸다', '동물이 다시 밟는다', '바로 사람이 발견한다'], ans: 0, exp: '자국이 지워지기 전에 다른 퇴적물이 덮어야 해요. 그 뒤 굳고, 위층이 깎여 나가면 자국이 드러나요.' },
  ];
  const TABNAME = { 1: '탭1 화석이 만들어지기까지', 2: '탭2 화석 실험실', 3: '탭3 몰드·캐스트', 4: '탭4 생흔 화석' };
  let idx = 0, score = 0, results = [];

  function render() {
    quiz.innerHTML = '';
    if (idx >= QS.length) return renderEnd();
    const Q = QS[idx];
    const box = document.createElement('div'); box.className = 'q';
    box.innerHTML = `<div class="qtop"><span class="qn">Q${idx + 1} / ${QS.length}</span><span class="qtab">${TABNAME[Q.tab]}</span></div><h3>${Q.q}</h3><div class="qbody"></div><div class="qfeed" hidden></div><div class="qctl"><button class="btn primary big" id="q-check" disabled>확인</button></div>`;
    quiz.appendChild(box);
    const body = box.querySelector('.qbody'), feed = box.querySelector('.qfeed'), btn = box.querySelector('#q-check');
    let getAnswer = () => null, markAnswer = () => { };
    if (Q.type === 'mc') {
      let sel = null;
      const order = Q.choices.map((c, i) => i).sort(() => Math.random() - .5);
      body.innerHTML = `<div class="choices">${order.map(i => `<button class="choice" data-i="${i}">${Q.choices[i]}</button>`).join('')}</div>`;
      body.querySelectorAll('.choice').forEach(c => c.onclick = () => { if (btn.dataset.done) return; body.querySelectorAll('.choice').forEach(x => x.classList.remove('sel')); c.classList.add('sel'); sel = +c.dataset.i; btn.disabled = false; });
      getAnswer = () => sel === Q.ans;
      markAnswer = () => body.querySelectorAll('.choice').forEach(c => { if (+c.dataset.i === Q.ans) c.classList.add('right'); else if (c.classList.contains('sel')) c.classList.add('wrong'); });
    } else if (Q.type === 'order') {
      const picked = [];
      const shuffled = Q.items.map((t, i) => i).sort(() => Math.random() - .5);
      body.innerHTML = `<div class="seq" id="seq"></div><div class="pool">${shuffled.map(i => `<button class="item" data-i="${i}">${Q.items[i]}</button>`).join('')}</div><div style="margin-top:8px"><button class="btn" id="seq-undo">↩ 하나 되돌리기</button></div>`;
      const seq = body.querySelector('#seq');
      const draw = () => { seq.innerHTML = picked.map((i, k) => `<span class="seqitem"><b>${k + 1}</b> ${Q.items[i]}</span>`).join('<span class="arrow">→</span>') || '<span class="seqhint">아래 카드를 순서대로 눌러 보세요</span>'; btn.disabled = picked.length !== Q.items.length; };
      body.querySelectorAll('.item').forEach(it => it.onclick = () => { if (btn.dataset.done || it.classList.contains('used')) return; it.classList.add('used'); picked.push(+it.dataset.i); draw(); });
      body.querySelector('#seq-undo').onclick = () => { if (btn.dataset.done || !picked.length) return; const i = picked.pop(); body.querySelector(`.item[data-i="${i}"]`).classList.remove('used'); draw(); };
      draw();
      getAnswer = () => picked.every((v, k) => v === k);
      markAnswer = () => { seq.querySelectorAll('.seqitem').forEach((s, k) => s.classList.add(picked[k] === k ? 'right' : 'wrong')); };
    } else if (Q.type === 'pic') {
      const order = Math.random() < .5 ? ['mold', 'cast'] : ['cast', 'mold']; const ans = {};
      body.innerHTML = `<div class="mc-pics"></div>`; const pics = body.querySelector('.mc-pics');
      order.forEach((k, i) => {
        const d = document.createElement('div'); d.className = 'mc-pic'; d.dataset.kind = k; d.dataset.key = 'p' + i;
        d.appendChild(k === 'mold' ? shellMold() : shellCast());
        d.insertAdjacentHTML('beforeend', `<div class="cap-s">${k === 'mold' ? '암석에 조개 모양이 움푹 파여 있어요' : '조개 모양으로 볼록하게 채워진 돌이에요'}</div><div class="lbl"><button data-v="mold">몰드</button><button data-v="cast">캐스트</button></div>`);
        d.querySelectorAll('.lbl button').forEach(b => b.onclick = () => { if (btn.dataset.done) return; d.querySelectorAll('.lbl button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ans[d.dataset.key] = b.dataset.v; btn.disabled = Object.keys(ans).length < 2; });
        pics.appendChild(d);
      });
      getAnswer = () => Array.from(pics.children).every(p => ans[p.dataset.key] === p.dataset.kind);
      markAnswer = () => pics.querySelectorAll('.mc-pic').forEach(p => p.querySelectorAll('.lbl button').forEach(b => { if (b.dataset.v === p.dataset.kind) b.classList.add('right'); else if (b.classList.contains('sel')) b.classList.add('wrong'); }));
    }
    btn.onclick = () => {
      if (btn.dataset.done) { idx++; render(); return; }
      const ok = getAnswer(); btn.dataset.done = 1; markAnswer();
      if (ok) score++; results.push(ok);
      feed.hidden = false; feed.className = 'qfeed ' + (ok ? 'good' : 'bad');
      feed.innerHTML = `<div class="fh">${ok ? '🎉 정답이에요!' : '😅 아쉬워요'}</div><div>${Q.exp}</div>`;
      btn.textContent = idx + 1 < QS.length ? '다음 문제 ▶' : '결과 보기 ▶'; btn.className = 'btn ok big';
      feed.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
  }
  function renderEnd() {
    const box = document.createElement('div'); box.className = 'q';
    const msg = score === QS.length ? '완벽해요! 화석 박사 🏆' : score >= QS.length * .7 ? '잘했어요! 틀린 문제의 탭을 다시 한번 보세요.' : '탭 1~4를 다시 보고 도전해 보세요.';
    box.innerHTML = `<div class="score show">${QS.length}문제 중 ${score}문제 정답! ${msg}</div><div class="review">${QS.map((q, i) => `<span class="rv ${results[i] ? 'ok' : 'no'}">Q${i + 1} ${results[i] ? '○' : '✕'}<small>탭${q.tab}</small></span>`).join('')}</div><div class="qctl"><button class="btn primary big" id="q-restart">↺ 처음부터 다시 풀기</button></div>`;
    quiz.appendChild(box);
    box.querySelector('#q-restart').onclick = () => { idx = 0; score = 0; results = []; render(); };
  }
  render();
})();

</script>
</body>
</html>
